<!DOCTYPE html>
<html>
<head>
    <title>Canvas Multi-Selection Test</title>
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #container { border: 1px solid #ddd; margin: 20px 0; }
        .instructions { background: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="instructions">
        <h3>Multi-Selection Test</h3>
        <p><strong>Instructions:</strong></p>
        <ul>
            <li>Click shapes to select them</li>
            <li>Ctrl/Cmd + Click to add to selection</li>
            <li>Drag on empty area to create selection rectangle</li>
            <li>Text elements show only horizontal resize handles</li>
        </ul>
    </div>
    
    <div id="container"></div>

    <script>
        // Initialize stage
        const stage = new Konva.Stage({
            container: 'container',
            width: 800,
            height: 600
        });

        const layer = new Konva.Layer();
        stage.add(layer);

        // Selection state
        let selectedIds = [];
        let selectionRect = { visible: false, x1: 0, y1: 0, x2: 0, y2: 0 };
        let isSelecting = false;
        const transformer = new Konva.Transformer();
        layer.add(transformer);

        // Create test elements
        const elements = [
            // Text element
            new Konva.Text({
                id: 'text1',
                x: 50,
                y: 50,
                text: 'Sample Text - Try resizing horizontally',
                fontSize: 20,
                fontFamily: 'Arial',
                fill: '#333',
                width: 250,
                draggable: true
            }),
            
            // Rectangle
            new Konva.Rect({
                id: 'rect1',
                x: 100,
                y: 150,
                width: 100,
                height: 80,
                fill: '#ff6b6b',
                stroke: '#000',
                strokeWidth: 2,
                draggable: true
            }),

            // Circle  
            new Konva.Circle({
                id: 'circle1',
                x: 300,
                y: 200,
                radius: 50,
                fill: '#4ecdc4',
                stroke: '#000',
                strokeWidth: 2,
                draggable: true
            }),

            // Another text
            new Konva.Text({
                id: 'text2',
                x: 400,
                y: 100,
                text: 'Another Text Element',
                fontSize: 16,
                fontFamily: 'Arial',
                fill: '#666',
                width: 200,
                draggable: true
            })
        ];

        elements.forEach(el => layer.add(el));

        // Helper functions
        function updateTransformer() {
            const selectedNodes = selectedIds.map(id => stage.findOne('#' + id)).filter(node => node);
            transformer.nodes(selectedNodes);
            
            // For text elements, limit to horizontal resize only
            if (selectedNodes.length === 1 && selectedNodes[0].className === 'Text') {
                transformer.enabledAnchors(['middle-left', 'middle-right']);
                transformer.rotateEnabled(false);
            } else {
                transformer.enabledAnchors(['top-left', 'top-center', 'top-right', 'middle-right', 'bottom-right', 'bottom-center', 'bottom-left', 'middle-left']);
                transformer.rotateEnabled(true);
            }
        }

        function selectElement(id, multi = false) {
            if (!multi) {
                selectedIds = [id];
            } else {
                const index = selectedIds.indexOf(id);
                if (index >= 0) {
                    selectedIds.splice(index, 1);
                } else {
                    selectedIds.push(id);
                }
            }
            updateTransformer();
            updateSelection();
        }

        function updateSelection() {
            elements.forEach(el => {
                if (selectedIds.includes(el.id())) {
                    el.stroke('#007bff');
                    el.strokeWidth(2);
                } else {
                    if (el.className !== 'Text') {
                        el.stroke('#000');
                        el.strokeWidth(2);
                    } else {
                        el.stroke(null);
                    }
                }
            });
            layer.batchDraw();
        }

        // Event handlers
        elements.forEach(el => {
            el.on('click', function(e) {
                e.cancelBubble = true;
                const isMulti = e.evt.ctrlKey || e.evt.metaKey;
                selectElement(this.id(), isMulti);
            });
        });

        // Stage events for selection rectangle
        stage.on('mousedown', function(e) {
            if (e.target === stage) {
                // Clear selection if clicking on empty area without selection rectangle
                if (!isSelecting) {
                    selectedIds = [];
                    updateTransformer();
                    updateSelection();
                }
                
                // Start selection rectangle
                isSelecting = true;
                const pos = stage.getPointerPosition();
                selectionRect = {
                    visible: true,
                    x1: pos.x,
                    y1: pos.y,
                    x2: pos.x,
                    y2: pos.y
                };
            }
        });

        stage.on('mousemove', function(e) {
            if (!isSelecting) return;
            
            const pos = stage.getPointerPosition();
            selectionRect.x2 = pos.x;
            selectionRect.y2 = pos.y;
            
            // Update selection rectangle visual
            let rect = stage.findOne('#selectionRect');
            if (!rect) {
                rect = new Konva.Rect({
                    id: 'selectionRect',
                    fill: 'rgba(0, 123, 255, 0.1)',
                    stroke: '#007bff',
                    strokeWidth: 1,
                    dash: [4, 4],
                    listening: false
                });
                layer.add(rect);
            }
            
            rect.setAttrs({
                x: Math.min(selectionRect.x1, selectionRect.x2),
                y: Math.min(selectionRect.y1, selectionRect.y2),
                width: Math.abs(selectionRect.x2 - selectionRect.x1),
                height: Math.abs(selectionRect.y2 - selectionRect.y1),
                visible: true
            });
            layer.batchDraw();
        });

        stage.on('mouseup', function() {
            if (!isSelecting) return;
            isSelecting = false;

            // Hide selection rectangle
            const rect = stage.findOne('#selectionRect');
            if (rect) {
                rect.visible(false);
            }

            // Calculate intersections
            const box = {
                x: Math.min(selectionRect.x1, selectionRect.x2),
                y: Math.min(selectionRect.y1, selectionRect.y2),
                width: Math.abs(selectionRect.x2 - selectionRect.x1),
                height: Math.abs(selectionRect.y2 - selectionRect.y1)
            };

            selectedIds = [];
            elements.forEach(el => {
                const elBox = el.getClientRect();
                if (Konva.Util.haveIntersection(box, elBox)) {
                    selectedIds.push(el.id());
                }
            });

            updateTransformer();
            updateSelection();
            layer.batchDraw();
        });

        // Transform handling for text width
        transformer.on('transform', function() {
            const nodes = transformer.nodes();
            nodes.forEach(node => {
                if (node.className === 'Text') {
                    const scaleX = node.scaleX();
                    node.scaleX(1);
                    node.width(node.width() * scaleX);
                }
            });
        });

        // Initial draw
        layer.batchDraw();
    </script>
</body>
</html>
