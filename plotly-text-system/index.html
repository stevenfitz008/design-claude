<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plotly Text System - Design Studio Clone</title>
  <meta name="description" content="Design Studio text editing system adapted for Plotly.js charts" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  
  <!-- Preload critical resources -->
  <link rel="preconnect" href="https://cdn.quilljs.com" />
  <link rel="preconnect" href="https://html2canvas.hertzen.com" />
  
  <style>
    /* Critical CSS for loading state */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #252a30;
      color: #f5f8fa;
      overflow: hidden;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
    }
    
    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #252a30;
      color: #f5f8fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #495563;
      border-top: 3px solid #48aff0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading state while React initializes -->
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>
        <h2 style="margin: 0 0 8px 0;">📊 Plotly Text System</h2>
        <p style="margin: 0; color: #a7b6c2;">Loading Design Studio text editing...</p>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
